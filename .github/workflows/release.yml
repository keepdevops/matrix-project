name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: darwin-arm64 }
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build binaries
        run: bash scripts/build_cpp_binaries.sh

      - name: Stage release tarball
        run: |
          set -e
          STAGE="matrix-${{ matrix.target }}"
          mkdir -p "$STAGE/bin" "$STAGE/config"
          cp proxy coordinator "$STAGE/bin/"
          cp swarm-config.json            "$STAGE/config/default.json"
          cp swarm-config-16gb.json       "$STAGE/config/16gb.json"
          cp swarm-config-32gb.json       "$STAGE/config/32gb.json"
          cp swarm-config-8agents-text-image.json "$STAGE/config/8agents.json"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.target }}
          path: |
            matrix-${{ matrix.target }}.tar.gz
            matrix-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true

  npm-publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (skip scripts to avoid postinstall)
        run: npm ci --ignore-scripts

      - name: Build React app
        run: npm run build

      - name: Stage dist (web + configs)
        run: bash scripts/stage-dist.sh

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
