name: Sync splash version
on:
  push:
    branches: [main]
    paths: ['package.json', 'docs/index.html']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update version strings
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/• v[0-9]+\.[0-9]+\.[0-9]+/• v${V}/g; s/open source · v[0-9]+\.[0-9]+\.[0-9]+/open source · v${V}/g" docs/index.html
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync splash version to package.json"
            git push
          fi
