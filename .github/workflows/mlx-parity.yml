name: MLX parity schema

on:
  push:
    branches: [main]
    paths:
      - 'docs/mlx-native-api-parity.md'
      - 'scripts/validate_mlx_parity_schema.sh'
      - '.github/workflows/mlx-parity.yml'
  pull_request:
    paths:
      - 'docs/mlx-native-api-parity.md'
      - 'scripts/validate_mlx_parity_schema.sh'
      - '.github/workflows/mlx-parity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate MLX parity schema (MS-131)
        run: bash scripts/validate_mlx_parity_schema.sh
